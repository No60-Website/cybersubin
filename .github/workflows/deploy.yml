name: Build and Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Upload to FTP
        env:
          RCLONE_CONFIG_FTP_TYPE: ftp
          RCLONE_CONFIG_FTP_HOST: ${{ secrets.FTP_HOST }}
          RCLONE_CONFIG_FTP_USER: ${{ secrets.FTP_USER }}
          RCLONE_CONFIG_FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          RCLONE_CONFIG_FTP_EXPLICIT_TLS: 'true'
        run: 'rclone copy ./build ftp: --progress'
